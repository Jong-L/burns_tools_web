<!-- 消极思维计数器 thought_counter：三道计数刻痕 + 一道划号线（数清楚） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
  <title>消极思维计数器</title>
  <style>
    .ink { stroke: #2F6B44; }
    .prime { stroke: #4F9C61; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #DCE8DC; }
      .prime { stroke: #7BC48F; }
    }
  </style>
  <g>
    <!-- 三道计数刻痕 -->
    <path class="ink" d="M7.4 6.4v10.6M11 6.4v10.6M14.6 6.4v10.6" />
    <!-- 第五道划过去 -->
    <path class="prime" d="M6 14.8 15.8 8.4" />
  </g>
</svg>
